name: iOS setup

# Run once, before the first build. It creates the Expo project, saves its ID in mobile/app.config.ts,
# and has Expo make the signing certificate and provisioning profile using the App Store Connect API key.
# Safe to run again: it reuses what already exists.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Create the Expo project and save its ID
        shell: bash
        run: |
          if grep -q 'const EAS_PROJECT_ID = "[0-9a-f-]\{36\}"' app.config.ts; then
            echo "Project ID already saved."
            exit 0
          fi
          out=$(eas init --non-interactive --force 2>&1 || true)
          echo "$out"
          id=$(echo "$out" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$id" ]; then
            echo "::error::Couldn't read the Expo project ID. Copy it from expo.dev into EAS_PROJECT_ID in mobile/app.config.ts."
            exit 1
          fi
          sed -i "s/const EAS_PROJECT_ID = \"\"/const EAS_PROJECT_ID = \"$id\"/" app.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Save the Expo project ID"
          git push
      - name: Make the signing certificate and profile
        shell: bash
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ../.github/scripts/eas-submit-config.sh
          export EXPO_ASC_API_KEY_PATH="$PWD/asc-api-key.p8" EXPO_ASC_KEY_ID="$ASC_KEY_ID" EXPO_ASC_ISSUER_ID="$ASC_ISSUER_ID" EXPO_APPLE_TEAM_ID="$APPLE_TEAM_ID"
          # EAS only creates a distribution certificate interactively; this answers the expected prompts.
          python3 ../.github/scripts/eas-ios-credentials.py
